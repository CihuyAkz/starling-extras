name: Download Latest Release

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repository (owner/repo)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    name: Download and Update Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: Get Latest Release Tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          SOURCE_REPO: ${{ inputs.source_repo }}
        run: |
          SOURCE_REPO="$(printf '%s' "$SOURCE_REPO" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"

          if [[ ! "$SOURCE_REPO" =~ ^[[:alnum:]_.-]+/[[:alnum:]_.-]+$ ]]; then
            echo "::error::Invalid source repository. Use the owner/repo format without extra characters."
            exit 1
          fi

          if ! TAG=$(gh release view \
            --repo "$SOURCE_REPO" \
            --json tagName \
            --jq '.tagName'); then
            echo "::error::Could not read the latest release from $SOURCE_REPO. Check that the repository has a published release and that REPO_TOKEN can access it."
            exit 1
          fi

          if [[ -z "$TAG" ]]; then
            echo "::error::No published release found in $SOURCE_REPO."
            exit 1
          fi

          echo "repository=$SOURCE_REPO" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Latest Release Assets
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          SOURCE_REPO: ${{ steps.release.outputs.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$SOURCE_REPO" \
            --dir . \
            --clobber

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update latest release assets"

          git push origin "HEAD:${GITHUB_REF_NAME}"
