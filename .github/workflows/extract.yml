
name: Extract ZIP and Folder

on:
  workflow_dispatch:
    inputs:
      folder_name:
        description: "Nama folder atau path folder. Kosongkan untuk extract ZIP."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: extract-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}
          persist-credentials: true

      - name: Find ZIP
        if: ${{ inputs.folder_name == '' }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' ZIP_FILES < <(
            find . -path './.git' -prune -o \
              -type f -iname "*.zip" -print0 | sort -z
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: Tidak ada file ZIP."
            exit 1
          fi

          echo "Ditemukan ${#ZIP_FILES[@]} file ZIP:"
          printf ' - %s\n' "${ZIP_FILES[@]}"

      - name: Extract ZIP
        if: ${{ inputs.folder_name == '' }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/extracted /tmp/final
          mkdir -p /tmp/extracted /tmp/final

          mapfile -d '' ZIP_FILES < <(
            find . -path './.git' -prune -o \
              -type f -iname "*.zip" -print0 | sort -z
          )

          INDEX=0

          for ZIP_FILE in "${ZIP_FILES[@]}"; do
            INDEX=$((INDEX + 1))

            echo "=================================="
            echo "Extracting: $ZIP_FILE"
            echo "=================================="

            echo "========== ZIP DIAGNOSTICS =========="

            echo "File: $ZIP_FILE"

            echo "File size:"
            stat -c '%s bytes' "$ZIP_FILE"

            echo "Detected format:"
            file "$ZIP_FILE"

            echo "First 16 bytes:"
            od -An -tx1 -N16 "$ZIP_FILE"

            echo "Last 32 bytes:"
            tail -c 32 "$ZIP_FILE" | od -An -tx1

            echo "====================================="

            if ! unzip -t "$ZIP_FILE"; then
              echo "ERROR: File ZIP rusak atau format tidak valid: $ZIP_FILE"
              exit 1
            fi

            CURRENT_EXTRACT="/tmp/extracted/$INDEX"

            mkdir -p "$CURRENT_EXTRACT"

            unzip -q "$ZIP_FILE" -d "$CURRENT_EXTRACT"

            CURRENT="$CURRENT_EXTRACT"

            while true; do
              entries=()

              while IFS= read -r -d '' item; do
                entries+=("$item")
              done < <(
                find "$CURRENT" -mindepth 1 -maxdepth 1 -print0
              )

              if [ "${#entries[@]}" -ne 1 ]; then
                break
              fi

              item="${entries[0]}"

              if [ ! -d "$item" ]; then
                break
              fi

              CURRENT="$item"
            done

            if [ -z "$(find "$CURRENT" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              echo "ERROR: ZIP kosong: $ZIP_FILE"
              exit 1
            fi

            echo "Merging contents from: $ZIP_FILE"

            rsync -av "$CURRENT/" /tmp/final/
          done

          echo "Semua ZIP berhasil diekstrak."

      - name: Merge extracted ZIP files
        if: ${{ inputs.folder_name == '' }}
        shell: bash
        run: |
          set -euo pipefail

          rsync -av --exclude='*.zip' /tmp/final/ ./

          echo "Semua hasil ZIP berhasil di-merge."

      - name: Extract Folder Directly to Root
        if: ${{ inputs.folder_name != '' }}
        shell: bash
        env:
          FOLDER_NAME: ${{ inputs.folder_name }}
        run: |
          set -euo pipefail

          ROOT="$(pwd -P)"

          FOLDER_NAME="${FOLDER_NAME#./}"

          if [[ -z "$FOLDER_NAME" || "$FOLDER_NAME" == "." ||
                "$FOLDER_NAME" == ".." ||
                "$FOLDER_NAME" == ../* ||
                "$FOLDER_NAME" == */../* ||
                "$FOLDER_NAME" == */.. ||
                "$FOLDER_NAME" == /* ]]; then
            echo "ERROR: Nama folder atau path tidak valid."
            exit 1
          fi

          SOURCE_CANDIDATE=""

          if [[ -d "$FOLDER_NAME" ]]; then
            SOURCE_CANDIDATE="$FOLDER_NAME"
          elif [[ "$FOLDER_NAME" != */* ]]; then
            MATCHES=()

            while IFS= read -r -d '' item; do
              if [[ "$(basename "$item")" == "$FOLDER_NAME" ]]; then
                MATCHES+=("$item")
              fi
            done < <(
              find . -path './.git' -prune -o \
                -type d -print0
            )

            if [[ "${#MATCHES[@]}" -eq 0 ]]; then
              echo "ERROR: Folder tidak ditemukan: $FOLDER_NAME"
              exit 1
            fi

            if [[ "${#MATCHES[@]}" -gt 1 ]]; then
              echo "ERROR: Ditemukan beberapa folder dengan nama yang sama."
              printf ' - %s\n' "${MATCHES[@]}"
              echo "Gunakan path folder yang lebih spesifik."
              exit 1
            fi

            SOURCE_CANDIDATE="${MATCHES[0]}"
          else
            echo "ERROR: Folder tidak ditemukan: $FOLDER_NAME"
            exit 1
          fi

          SOURCE_FOLDER="$(realpath -e -- "$SOURCE_CANDIDATE")"

          case "$SOURCE_FOLDER" in
            "$ROOT"/*)
              ;;
            *)
              echo "ERROR: Folder harus berada di dalam repository."
              exit 1
              ;;
          esac

          RELATIVE_SOURCE="${SOURCE_FOLDER#"$ROOT"/}"

          if [[ "$RELATIVE_SOURCE" == ".git" ||
                "$RELATIVE_SOURCE" == .git/* ||
                "$RELATIVE_SOURCE" == */.git ||
                "$RELATIVE_SOURCE" == */.git/* ]]; then
            echo "ERROR: Tidak bisa mengekstrak folder .git."
            exit 1
          fi

          if [[ -z "$(find "$SOURCE_FOLDER" -mindepth 1 -print -quit)" ]]; then
            echo "ERROR: Folder kosong."
            exit 1
          fi

          echo "=================================="
          echo "Folder: $SOURCE_FOLDER"
          echo "Target: Repository Root"
          echo "=================================="

          rm -rf /tmp/folder-content
          mkdir -p /tmp/folder-content

          rsync -av --exclude='.git' \
            "$SOURCE_FOLDER/" /tmp/folder-content/

          echo "Folder berhasil disalin ke temporary storage."

          rm -rf -- "$SOURCE_FOLDER"

          rsync -av --exclude='.git' \
            /tmp/folder-content/ ./

          echo "=================================="
          echo "Folder berhasil diekstrak ke root!"
          echo "=================================="

      - name: Remove source ZIP
        if: ${{ inputs.folder_name == '' }}
        shell: bash
        run: |
          set -euo pipefail

          find . -path './.git' -prune -o \
            -type f -iname "*.zip" -delete

          echo "Semua file ZIP sumber berhasil dihapus."

      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Extract ZIP or Folder to Root"

          TARGET_BRANCH="$GITHUB_REF_NAME"

          echo "Push ke branch: $TARGET_BRANCH"

          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          echo "Push berhasil!"
