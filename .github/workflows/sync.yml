
      - name: Merge Upstream Release
        env:
          RELEASE_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          git merge --no-edit --no-ff "$RELEASE_COMMIT"

      - name: Verify Merge
        env:
          RELEASE_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD; then
            echo "Error: Upstream release is not included in the current branch."
            exit 1
          fi

          echo "Upstream release successfully merged."

      - name: Push Target Branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

          echo "================================"
          echo "Upstream Release Merge Completed"
          echo "Target: ${TARGET_BRANCH}"
          echo "Release: ${{ steps.upstream.outputs.tag }}"
          echo "================================"
