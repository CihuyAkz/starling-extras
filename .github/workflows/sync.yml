
name: Sync Upstream Release

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: exact-release-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Exact Release Sync
    runs-on: ubuntu-latest

    steps:
      - name: Validate Target Branch
        run: |
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Error: Workflow must run from a branch."
            exit 1
          fi

          echo "Target branch: ${GITHUB_REF_NAME}"

      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch Latest Upstream Release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          RELEASE_TAG=$(gh release view \
            --repo starling-client/starling \
            --json tagName \
            --jq '.tagName')

          if [ -z "$RELEASE_TAG" ]; then
            echo "Error: No upstream release found."
            exit 1
          fi

          git remote add upstream https://github.com/starling-client/starling.git

          git fetch upstream \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          RELEASE_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")

          if [ -z "$RELEASE_COMMIT" ]; then
            echo "Error: Unable to resolve release commit."
            exit 1
          fi

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${RELEASE_COMMIT}" >> "$GITHUB_OUTPUT"

          echo "Release: ${RELEASE_TAG}"
          echo "Commit: ${RELEASE_COMMIT}"

      - name: Exact Release Sync
        env:
          RELEASE_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          git reset --hard "$RELEASE_COMMIT"

          echo "Successfully synced to upstream release."
          echo "Current commit: $(git rev-parse HEAD)"

      - name: Verify Release Sync
        env:
          RELEASE_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          CURRENT_COMMIT=$(git rev-parse HEAD)

          if [ "$CURRENT_COMMIT" != "$RELEASE_COMMIT" ]; then
            echo "Error: Commit verification failed."
            exit 1
          fi

          echo "Release verification successful."

      - name: Push Target Branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

          echo "================================"
          echo "Exact Release Sync Completed"
          echo "Target: ${TARGET_BRANCH}"
          echo "Release: ${{ steps.upstream.outputs.tag }}"
          echo "================================"
